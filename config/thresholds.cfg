# Edge Health Monitor thresholds.
# Both the C++ gateway and the local dashboard read this file, so the alert
# limits only need to be changed in one place.
#
# temperature_max_centi_c : temperature limit in hundredths of a degree
# current_max_ma          : current limit in milliamps
# vibration_max_mg        : vibration RMS limit in milli-g
# online_timeout_s        : dashboard treats a device as offline after this gap

temperature_max_centi_c=8000
current_max_ma=2500
vibration_max_mg=500
online_timeout_s=5
